# Comprobación externa: lo mismo que el pre-push (`npm run verify`) más la recogida con el adaptador falso.
# Sin secretos ni red hacia Azure DevOps. `verify:brief` no va aquí: necesita un informe escrito por la IA
# y output/ no se versiona.
# Patrones tomados del workflow del buscador de hoteles (sesión 4 del track): permisos de solo lectura,
# credenciales sin persistir y acciones fijadas por SHA.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Typecheck, lint, tests y recogida con fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # El mínimo de "engines" en package.json.
          node-version: "20.19"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck, lint y tests
        run: npm run verify
      - name: Recogida con el adaptador falso
        run: npm run collect -- --fixtures
